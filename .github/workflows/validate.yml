name: Validate Noetica Skills

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate shell syntax
        run: bash -n install.sh tests/test-install.sh skills/generate-html-report/scripts/init-report-center skills/generate-html-report/scripts/test-init skills/serve-web-over-ssh/scripts/web-session
      - name: Run repository tests
        run: make test
