<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="640" viewBox="0 0 1600 640" role="img" aria-labelledby="title desc">
  <title id="title">Noetica agent skills</title>
  <desc id="desc">A dark academic banner showing a connected research workflow of papers, charts, code, and reports.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071826"/>
      <stop offset="0.58" stop-color="#0d2b3a"/>
      <stop offset="1" stop-color="#123b43"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#6fd3c2" stop-opacity=".22"/>
      <stop offset="1" stop-color="#6fd3c2" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f5d99b"/>
      <stop offset="1" stop-color="#c99b4f"/>
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#bce8e0" stroke-opacity=".055"/>
    </pattern>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#02090f" flood-opacity=".45"/>
    </filter>
  </defs>

  <rect width="1600" height="640" rx="38" fill="url(#bg)"/>
  <rect width="1600" height="640" rx="38" fill="url(#grid)"/>
  <circle cx="1170" cy="330" r="420" fill="url(#halo)"/>
  <circle cx="1450" cy="80" r="220" fill="#d5ad66" opacity=".04"/>

  <g transform="translate(116 70)">
