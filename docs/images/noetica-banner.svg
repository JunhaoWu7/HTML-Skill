    <path d="M5 104h490" stroke="url(#gold)" stroke-width="3"/>
    <text x="5" y="153" fill="#d8e8e4" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="22">Reusable · Cross-agent · Research-minded</text>
